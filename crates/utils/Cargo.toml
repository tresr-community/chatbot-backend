[package]

name = "chatbot-utils"
description = "NFTREASURE Community ChatBot shared utilities"
version = "1.0.0"
edition = "2021"
license = "Unlicense"
repository = "https://github.com/NFPLEASURE/chatbot"

[package.metadata.release]

release = false

# https://github.com/rustwasm/wasm-pack/issues/1247
[package.metadata.wasm-pack.profile.release]

wasm-opt = true

[lib]

crate-type = ["rlib", "cdylib"]

[dependencies]

worker = "0.5.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"

[target.'cfg(target_arch = "wasm32")'.dependencies]

wasm-bindgen = "0.2.99"
