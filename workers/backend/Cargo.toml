[package]

name = "api"
description = "A chatbot for the NFTREASURE community"
version = "1.0.0"
edition = "2021"
license = "Unlicense"
repository = "https://github.com/NFPLEASURE/chatbot"

[package.metadata.release]

release = false

# https://github.com/rustwasm/wasm-pack/issues/1247
[package.metadata.wasm-pack.profile.release]

wasm-opt = true

[lib]

crate-type = ["cdylib"]

[dependencies]

# Load the shared-libs crate
utils = { path = "../../crates/utils" }

# External dependencies
worker = "0.4.2"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
getrandom = { version = "0.2.15", features = ["js"] }
rand = "0.8.5"
