[package]

name = "chatbot-backend"
description = "NFTREASURE Community ChatBot backend"
version = "1.0.0"
edition = "2021"
license = "Unlicense"
repository = "https://github.com/NFPLEASURE/chatbot"

[package.metadata.release]

release = false

# https://github.com/rustwasm/wasm-pack/issues/1247
[package.metadata.wasm-pack.profile.release]

wasm-opt = true

[lib]

crate-type = ["cdylib"]

[dependencies]

# Load the shared-libs crate
chatbot-utils = { path = "../../crates/utils" }

# External dependencies
worker = "0.5.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
getrandom = { version = "0.2.15", features = ["js"] }
rand = "0.8.5"
